name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proyek
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Unduh Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot_bin

      - name: Unduh export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p tpz_tmp
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d tpz_tmp
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -r tpz_tmp/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Buat debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Import aset Godot
        run: ./godot_bin --headless --import || true

      - name: Export APK debug
        run: |
          mkdir -p build
          ./godot_bin --headless --export-debug "Android" build/ShiftRoad.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShiftRoad-debug
          path: build/ShiftRoad.apk
